# Weekly check for how far this fork has fallen behind
# https://github.com/portainer/portainer-mcp. Opens (or updates) a single
# tracking issue labeled `upstream-drift` rather than spamming a new issue
# every run — see .claude/skills/upstream-sync/SKILL.md for the actual
# sync procedure once drift is found.

name: Upstream drift check

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch upstream and count drift
        id: drift
        run: |
          git remote add upstream https://github.com/portainer/portainer-mcp
          git fetch upstream main
          count=$(git rev-list --count HEAD..upstream/main)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          git log --oneline HEAD..upstream/main > /tmp/drift-log.txt
          git diff --stat HEAD..upstream/main > /tmp/drift-diffstat.txt

      - name: Open or update the tracking issue
        if: steps.drift.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.drift.outputs.count }}
        run: |
          body=$(
            echo "upstream/main is **$COUNT commit(s)** ahead of this fork's main."
            echo
            echo "Sync procedure: see \`.claude/skills/upstream-sync/SKILL.md\`."
            echo
            echo "### Commits"
            echo '```'
            cat /tmp/drift-log.txt
            echo '```'
            echo
            echo "### Files touched"
            echo '```'
            cat /tmp/drift-diffstat.txt
            echo '```'
          )

          existing=$(gh issue list --state open --label upstream-drift --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "Upstream drift: $COUNT commit(s) behind portainer/portainer-mcp" --body "$body"
            gh issue comment "$existing" --body "Re-checked $(date -u +%Y-%m-%dT%H:%M:%SZ): still $COUNT commit(s) behind."
          else
            gh issue create \
              --title "Upstream drift: $COUNT commit(s) behind portainer/portainer-mcp" \
              --body "$body" \
              --label upstream-drift
          fi

      - name: Close the tracking issue if drift is resolved
        if: steps.drift.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --label upstream-drift --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Resolved: fork main is now even with upstream/main."
            gh issue close "$existing"
          fi
